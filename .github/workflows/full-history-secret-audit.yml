name: Full History Secret Audit

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  actions: read
  issues: read
  pull-requests: read

concurrency:
  group: full-history-secret-audit-${{ github.repository }}
  cancel-in-progress: false

jobs:
  audit:
    uses: ./.github/workflows/full-history-secret-audit-reusable.yml
