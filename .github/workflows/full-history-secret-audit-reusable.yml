name: Reusable Full History Secret Audit

on:
  workflow_call:

permissions:
  contents: read
  actions: read
  issues: read
  pull-requests: read

jobs:
  audit:
    name: all-refs / history / external surfaces
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ github.token }}
      GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks:v8.30.1
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Fetch all advertised refs and LFS objects
        shell: bash
        run: |
          set -euo pipefail
          git fetch --force --prune origin '+refs/*:refs/audit/*'
          git lfs install --local >/dev/null 2>&1 || true
          git lfs fetch --all || true
          mkdir -p .audit/raw .audit/safe .audit/external/{release-assets,actions-artifacts,actions-logs,attachments,metadata}

      - name: Collect release assets, Actions artifacts/logs, issues, PRs and attachments
        id: collect
        shell: bash
        run: |
          set +e
          set -uo pipefail
          errors=0
          unavailable=0
          blocked=0
          downloaded=0
          open_runs=0
          root="$PWD/.audit/external"

          collect_json() {
            local endpoint="$1" out="$2"
            if gh api --paginate --slurp "$endpoint" > "$out"; then
              return 0
            fi
            echo '[]' > "$out"
            echo "Collection failed for ${endpoint}" >&2
            errors=$((errors + 1))
          }

          # HTTP 200 with a real body is scanned.
          # HTTP 404 and 410 mean GitHub no longer has the bytes (deleted run
          # logs, expired logs, missing assets). Those objects cannot be
          # scanned on Actions; they are reported and do not fail the gate.
          # Any other failure, including permission and rate-limit exhaustion,
          # is a blocked live surface and keeps the audit INCOMPLETE.
          fetch_object() {
            local url="$1" dest="$2" accept="$3"
            local attempt code
            for attempt in 1 2 3; do
              code="$(curl -sS -L --max-time 180 -o "$dest" -w '%{http_code}' \
                -H "Authorization: Bearer ${GH_TOKEN}" \
                -H "Accept: ${accept}" \
                "$url" || true)"
              code="${code//$'\r'/}"
              case "$code" in
                200)
                  if [ ! -s "$dest" ]; then
                    rm -f "$dest"
                    blocked=$((blocked + 1))
                    echo "Blocked empty 200 from ${url}" >&2
                    return 0
                  fi
                  if jq -e 'type == "object" and has("message") and has("documentation_url")' "$dest" >/dev/null 2>&1; then
                    rm -f "$dest"
                    blocked=$((blocked + 1))
                    echo "Blocked GitHub error document from ${url}" >&2
                    return 0
                  fi
                  downloaded=$((downloaded + 1))
                  return 0
                  ;;
                404|410)
                  rm -f "$dest"
                  unavailable=$((unavailable + 1))
                  return 0
                  ;;
                429|500|502|503|504)
                  rm -f "$dest"
                  sleep $((attempt * 5))
                  ;;
                *)
                  rm -f "$dest"
                  blocked=$((blocked + 1))
                  echo "Blocked HTTP ${code:-none} for ${url}" >&2
                  return 0
                  ;;
              esac
            done
            blocked=$((blocked + 1))
            echo "Blocked after retries: ${url}" >&2
          }

          collect_json "repos/${GITHUB_REPOSITORY}/releases?per_page=100" "$root/metadata/releases.json"
          collect_json "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" "$root/metadata/artifacts.json"
          collect_json "repos/${GITHUB_REPOSITORY}/actions/runs?per_page=100" "$root/metadata/runs.json"
          collect_json "repos/${GITHUB_REPOSITORY}/issues?state=all&per_page=100" "$root/metadata/issues.json"
          collect_json "repos/${GITHUB_REPOSITORY}/issues/comments?per_page=100" "$root/metadata/issue-comments.json"
          collect_json "repos/${GITHUB_REPOSITORY}/pulls/comments?per_page=100" "$root/metadata/pr-review-comments.json"

          while IFS=$'\t' read -r id name url; do
            [ -n "${id:-}" ] || continue
            safe_name=$(printf '%s' "${name:-asset}" | tr '/\\ ' '___' | tr -cd '[:alnum:]_.-')
            [ -n "$safe_name" ] || safe_name="asset"
            fetch_object "$url" "$root/release-assets/${id}-${safe_name}" "application/octet-stream"
          done < <(jq -r '.[] | .[]? | .assets[]? | [.id, .name, .url] | @tsv' "$root/metadata/releases.json" 2>/dev/null || true)

          expired_artifacts=$(jq '[.[] | .artifacts[]? | select(.expired == true)] | length' "$root/metadata/artifacts.json" 2>/dev/null || echo 0)
          case "$expired_artifacts" in
            ''|*[!0-9]*) expired_artifacts=0 ;;
          esac
          unavailable=$((unavailable + expired_artifacts))

          while IFS=$'\t' read -r id name; do
            [ -n "${id:-}" ] || continue
            safe_name=$(printf '%s' "${name:-artifact}" | tr '/\\ ' '___' | tr -cd '[:alnum:]_.-')
            [ -n "$safe_name" ] || safe_name="artifact"
            fetch_object \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}/zip" \
              "$root/actions-artifacts/${id}-${safe_name}.zip" \
              "application/vnd.github+json"
          done < <(jq -r '.[] | .artifacts[]? | select(.expired == false) | [.id, .name] | @tsv' "$root/metadata/artifacts.json" 2>/dev/null || true)

          open_runs=$(jq '[.[] | .workflow_runs[]? | select(.status != "completed")] | length' "$root/metadata/runs.json" 2>/dev/null || echo 0)
          case "$open_runs" in
            ''|*[!0-9]*) open_runs=0 ;;
          esac

          while read -r run_id; do
            [ -n "${run_id:-}" ] || continue
            [ "$run_id" = "$GITHUB_RUN_ID" ] && continue
            fetch_object \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/logs" \
              "$root/actions-logs/${run_id}.zip" \
              "application/vnd.github+json"
          done < <(jq -r --arg current "$GITHUB_RUN_ID" '.[] | .workflow_runs[]? | select(.status == "completed") | select((.id | tostring) != $current) | .id' "$root/metadata/runs.json" 2>/dev/null || true)

          grep -RhoE 'https://(private-user-images\.githubusercontent\.com|user-images\.githubusercontent\.com|github\.com/user-attachments/assets)/[^"[:space:]]+' "$root/metadata" 2>/dev/null | sort -u > "$root/metadata/attachment-urls.txt" || true
          n=0
          while IFS= read -r url; do
            [ -n "$url" ] || continue
            n=$((n + 1))
            fetch_object "$url" "$root/attachments/attachment-${n}" "application/octet-stream"
          done < "$root/metadata/attachment-urls.txt"

          {
            echo "collection_errors=${errors}"
            echo "unavailable_objects=${unavailable}"
            echo "blocked_objects=${blocked}"
            echo "downloaded_objects=${downloaded}"
            echo "open_runs=${open_runs}"
          } >> "$GITHUB_OUTPUT"

      - name: Scan all Git history, LFS objects, and collected external surfaces
        id: scan
        shell: bash
        run: |
          set +e
          set -uo pipefail
          history_code=0
          lfs_code=0
          external_code=0
          scan_error=0

          note_scan() {
            local label="$1" code="$2" report="$3"
            if [ "$code" -eq 0 ] && [ ! -s "$report" ]; then
              echo '[]' > "$report"
            fi
            if [ ! -f "$report" ] || ! jq -e 'type == "array"' "$report" >/dev/null 2>&1; then
              echo "${label} report is missing or not a JSON array (exit ${code})" >&2
              echo '[]' > "$report"
              scan_error=1
              return 0
            fi
            if [ "$code" -gt 1 ]; then
              echo "${label} scanner failed with exit ${code}" >&2
              scan_error=1
            elif [ "$code" -eq 1 ] && [ "$(jq 'length' "$report")" -eq 0 ]; then
              echo "${label} scanner exited 1 without a findings array" >&2
              scan_error=1
            fi
          }

          docker run --rm -v "$PWD:/repo" -w /repo "$GITLEAKS_IMAGE" detect \
            --source=/repo --log-opts='--all' --redact \
            --max-archive-depth=3 --max-decode-depth=2 \
            --report-format=json --report-path=/repo/.audit/raw/history.json
          history_code=$?
          note_scan history "$history_code" .audit/raw/history.json

          if [ -d .git/lfs/objects ] && [ -n "$(find .git/lfs/objects -type f -print -quit 2>/dev/null)" ]; then
            docker run --rm -v "$PWD:/repo" -w /repo "$GITLEAKS_IMAGE" detect \
              --no-git --source=/repo/.git/lfs/objects --redact \
              --max-archive-depth=3 --max-decode-depth=2 \
              --report-format=json --report-path=/repo/.audit/raw/lfs.json
            lfs_code=$?
          else
            echo '[]' > .audit/raw/lfs.json
            lfs_code=0
          fi
          note_scan lfs "$lfs_code" .audit/raw/lfs.json

          docker run --rm -v "$PWD:/repo" -w /repo "$GITLEAKS_IMAGE" detect \
            --no-git --source=/repo/.audit/external --redact \
            --max-archive-depth=3 --max-decode-depth=2 \
            --report-format=json --report-path=/repo/.audit/raw/external.json
          external_code=$?
          note_scan external "$external_code" .audit/raw/external.json

          sanitize() {
            local src="$1" dst="$2"
            if ! jq '[.[] | {RuleID,Description,File,Commit,StartLine,EndLine,Fingerprint}]' "$src" > "$dst"; then
              echo '[]' > "$dst"
              echo "Could not redact ${src}" >&2
              scan_error=1
            fi
          }
          sanitize .audit/raw/history.json .audit/safe/history-findings.json
          sanitize .audit/raw/lfs.json .audit/safe/lfs-findings.json
          sanitize .audit/raw/external.json .audit/safe/external-findings.json

          history_count=$(jq 'length' .audit/safe/history-findings.json 2>/dev/null || echo -1)
          lfs_count=$(jq 'length' .audit/safe/lfs-findings.json 2>/dev/null || echo -1)
          external_count=$(jq 'length' .audit/safe/external-findings.json 2>/dev/null || echo -1)
          for count in "$history_count" "$lfs_count" "$external_count"; do
            case "$count" in
              ''|*[!0-9]*) scan_error=1 ;;
            esac
          done
          case "$history_count" in ''|*[!0-9]*) history_count=0 ;; esac
          case "$lfs_count" in ''|*[!0-9]*) lfs_count=0 ;; esac
          case "$external_count" in ''|*[!0-9]*) external_count=0 ;; esac
          total=$((history_count + lfs_count + external_count))
          rm -rf .audit/raw .audit/external

          {
            echo "history_code=${history_code}"
            echo "lfs_code=${lfs_code}"
            echo "external_code=${external_code}"
            echo "history_count=${history_count}"
            echo "lfs_count=${lfs_count}"
            echo "external_count=${external_count}"
            echo "total=${total}"
            echo "scan_error=${scan_error}"
          } >> "$GITHUB_OUTPUT"

      - name: Build publication-gate status
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          num() {
            case "$1" in
              ''|*[!0-9]*) echo 0 ;;
              *) echo "$1" ;;
            esac
          }
          findings=$(num '${{ steps.scan.outputs.total }}')
          errors=$(num '${{ steps.collect.outputs.collection_errors }}')
          unavailable=$(num '${{ steps.collect.outputs.unavailable_objects }}')
          blocked=$(num '${{ steps.collect.outputs.blocked_objects }}')
          downloaded=$(num '${{ steps.collect.outputs.downloaded_objects }}')
          open_runs=$(num '${{ steps.collect.outputs.open_runs }}')
          scan_error=$(num '${{ steps.scan.outputs.scan_error }}')
          history_count=$(num '${{ steps.scan.outputs.history_count }}')
          lfs_count=$(num '${{ steps.scan.outputs.lfs_count }}')
          external_count=$(num '${{ steps.scan.outputs.external_count }}')

          # Missing step outputs mean an earlier step did not finish cleanly.
          if [ -z '${{ steps.scan.outputs.total }}' ] || [ -z '${{ steps.collect.outputs.blocked_objects }}' ]; then
            scan_error=1
          fi

          status=PASS
          if [ "$errors" -gt 0 ] || [ "$scan_error" -gt 0 ] || [ "$blocked" -gt 0 ]; then
            status=INCOMPLETE
          fi
          if [ "$findings" -gt 0 ]; then
            status=FAIL_FINDINGS
          fi

          mkdir -p .audit/safe
          cat > .audit/safe/status.json <<EOF
          {
            "repository": "${GITHUB_REPOSITORY}",
            "run_id": "${GITHUB_RUN_ID}",
            "gitleaks": "v8.30.1",
            "scope": ["all-advertised-refs", "git-history", "tags", "secondary-branches", "lfs-objects", "release-assets", "actions-artifacts", "actions-logs", "issues-pr-metadata", "issues-pr-attachments"],
            "history_findings": ${history_count},
            "lfs_findings": ${lfs_count},
            "external_findings": ${external_count},
            "collection_errors": ${errors},
            "downloaded_objects": ${downloaded},
            "unavailable_objects": ${unavailable},
            "blocked_objects": ${blocked},
            "open_runs_without_logs": ${open_runs},
            "status": "${status}"
          }
          EOF

          {
            echo "## Full History Secret Audit"
            echo ""
            echo "- Status: **${status}**"
            echo "- Git-history findings: ${history_count}"
            echo "- LFS findings: ${lfs_count}"
            echo "- External-surface findings: ${external_count}"
            echo "- Downloaded objects scanned: ${downloaded}"
            echo "- Unavailable objects (GitHub HTTP 404/410 or expired artifacts): ${unavailable}"
            echo "- Blocked live surfaces: ${blocked}"
            echo "- Collection errors: ${errors}"
            echo "- Runs still open, so logs do not exist yet: ${open_runs}"
            echo ""
            echo "PASS means every retrievable surface was scanned and gitleaks reported no secrets."
            echo "GitHub deletes or never retains some Actions logs and expired artifacts."
            echo "Those objects have no bytes left to scan. Counting them does not weaken the check on objects GitHub still serves."
            echo "A secret finding fails the gate even if another surface was blocked."
            echo "A PASS is a publication gate for secret exposure only. It is not a general security certification."
          } | tee .audit/safe/summary.md >> "$GITHUB_STEP_SUMMARY"
          echo "status=${status}" >> "$GITHUB_OUTPUT"

      - name: Upload redacted audit evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: full-history-secret-audit-${{ github.run_id }}
          path: .audit/safe/
          if-no-files-found: error
          retention-days: 30

      - name: Enforce publication gate
        shell: bash
        run: |
          case '${{ steps.gate.outputs.status }}' in
            PASS) exit 0 ;;
            FAIL_FINDINGS)
              echo 'Secret findings detected. Repository must remain private until remediated.'
              exit 1
              ;;
            *)
              echo 'Audit incomplete because a live surface could not be scanned or the scanner failed.'
              exit 2
              ;;
          esac
