name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capability-gateway:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: capability-gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm test
      - run: npm run build

  tract-runtime:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tract/runtime
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test

  tract-sdk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tract/sdk/typescript
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm test
